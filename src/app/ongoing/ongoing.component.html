<ion-content class="ion-padding" [fullscreen]="true">
  <div class="container">



    <div class="quiz-title">Web Development Fundamentals</div>
    <div class="quiz-description">Test your knowledge of basic web development concepts including HTML, CSS, and JavaScript.</div>
    <div class="quiz-meta">
        <span class="meta-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M12 8V12L15 15M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          80 min
        </span>
        <span class="meta-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M12 8V12L15 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
         medium
        </span>
        <span class="meta-item">
            <i class="fas fa-bolt"></i>
            50 XP
          </span>
      </div>

      
    <div class="timer-container">

        <i class="fas fa-clock"></i>
        <div class="timer">12:45</div>
    </div>

    <div class="progress-container">
        <div class="progress-info">
            <span>Progress: 3/5</span>
            <span>60%</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
    </div>

    <div class="question-card">
        <div class="question-header">
            <div class="question-number">Question 3 of 5</div>
        </div>

        <div class="question-text">Which of the following CSS properties is used to control the spacing between elements?</div>
        
        <div class="options-list">
            <div class="option-item">
                <div class="option-radio"></div>
                <div class="option-text">padding</div>
            </div>
            <div class="option-item selected">
                <div class="option-radio"></div>
                <div class="option-text">margin</div>
            </div>
            <div class="option-item">
                <div class="option-radio"></div>
                <div class="option-text">border</div>
            </div>
            <div class="option-item">
                <div class="option-radio"></div>
                <div class="option-text">spacing</div>
            </div>
        </div>
    </div>

    <div class="quiz-actions">
        <button class="action-btn prev-btn">
            <i class="fas fa-arrow-left"></i>
            Previous
        </button>
        <button class="action-btn next-btn">
            Next
            <i class="fas fa-arrow-right"></i>
        </button>
        <button *ngIf="false" class="action-btn submit-btn">
            Submit Quiz
            <i class="fas fa-paper-plane"></i>
        </button>
    </div>
</div>
</ion-content>

<ion-content [fullscreen]="true">

  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
  </ion-refresher>

  <!-- Header with user greeting and stats -->
  <div class="homeHeader">
    <div class="homeHeader-content">
      <div class="user-greeting">
        <h1>Welcome back, {{currentUser.name}}!</h1>
        <p>Ready to challenge yourself today?</p>
      </div>

      <img [src]="currentUser.avatar" (click)="logout()" crossorigin="anonymous" class="user-avatar"
        (error)="avatarError($event)">
    </div>
  </div>

  <!-- Main content section -->
  <app-quizes [ParentInjected]="true" [publishedQuizzes$]="publishedQuizzes$">

    <!-- Leaderboard using ng-content -->
      <div class="section-title">
        <h2>Top Learners</h2>
        <a href="#">See ranking <i class="fas fa-chevron-right"></i></a>
      </div>
  
      <ng-container *ngIf="leaderboardUsers$ | async as leaderboardUsers; else leaderboardLoading">
        <div *ngIf="leaderboardUsers.length > 0; else emptyLeaderboard" class="quiz-card">
          <div class="content" style="padding-bottom: 8px;">
            <div class="leaderboard-item" *ngFor="let user of leaderboardUsers; trackBy: trackByUserId">
              <div class="rank">{{leaderboardUsers.indexOf(user) + 1}}</div>
              <div class="user">
                <img [src]="user.avatar ? makeSafeUrl(user.avatar) : 'assets/user.png'" 
                     crossorigin="anonymous" 
                     (error)="avatarError($event)">
                <div>
                  <div class="name">{{user.name}}</div>
                </div>
              </div>
              <div class="points">{{user.points}}</div>
            </div>
          </div>
        </div>
  
        <ng-template #emptyLeaderboard>
          <div class="quiz-card">
            <div class="ph-item">
              <div class="ph-col-12">
                <div class="ph-row">
                  <div class="ph-col-12 big"></div>
                  <div class="ph-col-12 big"></div>
                  <div class="ph-col-12 big"></div>
                  <div class="ph-col-12 big"></div>
                  <div class="ph-col-12 big"></div>
                  <div class="ph-col-12 big"></div>
                </div>
              </div>
            </div>
          </div>
        </ng-template>
      </ng-container>
  
      <ng-template #leaderboardLoading>
        <div class="quiz-card">
          <div class="ph-item">
            <div class="ph-col-12">
              <div class="ph-row">
                <div class="ph-col-12 big"></div>
                <div class="ph-col-12 big"></div>
                <div class="ph-col-12 big"></div>
                <div class="ph-col-12 big"></div>
                <div class="ph-col-12 big"></div>
                <div class="ph-col-12 big"></div>
              </div>
            </div>
          </div>
        </div>
      </ng-template>
  </app-quizes>


  
    
</ion-content>

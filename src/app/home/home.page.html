<ion-content [fullscreen]="true">
  <!-- Header with user greeting and stats -->
  <div class="homeHeader">
    <div class="homeHeader-content">
      <div class="user-greeting" *ngIf="currentUser$ | async as currentUser">
        <h1>Welcome back, {{currentUser.name}}!</h1>
        <p>Ready to challenge yourself today?</p>
      </div>
  
      <img 
        *ngIf="currentUser$ | async as currentUser"
        [src]="currentUser.avatar" 
        (click)="logout()" 
        crossorigin="anonymous" 
        class="user-avatar"
        (error)="avatarError($event)">
    </div>
  </div>

  <!-- Main content section -->
  <app-live-quizes [ParentInjected]="true"></app-live-quizes>
  <app-quizes [ParentInjected]="true" (handleRefresh)="handleRefresh($event)">
    <!-- Leaderboard using ng-content -->
    <app-users [ParentInjected]="true"></app-users>
  </app-quizes>

</ion-content>
